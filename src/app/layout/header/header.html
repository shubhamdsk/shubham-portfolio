<header class="header header--scrolled">
    <div class="app-container header__container">
        <a class="header__brand" routerLink="/" aria-label="Go to Shubham Deshmukh portfolio home"
            (click)="onNavigationClick(navigationItems[0], $event)">
            <span class="header__brand-mark" aria-hidden="true">SD</span>

            <span class="header__brand-content">
                <span class="header__brand-name">Shubham Deshmukh</span>
                <span class="header__brand-role">Frontend Developer</span>
            </span>
        </a>

        <nav id="primary-navigation" class="header__nav" [class.header__nav--open]="isMenuOpen()"
            aria-label="Primary navigation">
            @for (item of navigationItems; track item.path) {
            <a class="header__nav-link" routerLinkActive="header__nav-link--active" ariaCurrentWhenActive="page"
                [class.header__nav-link--section-active]="isHomeRoute() && activeSectionId() === item.sectionId"
                [routerLink]="item.path" [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                [attr.aria-label]="item.ariaLabel" (click)="onNavigationClick(item, $event)">
                {{ item.label }}
            </a>
            }
        </nav>

        <div class="header__actions">
            <button class="header__theme-button" type="button" [attr.aria-label]="themeToggleLabel()"
                [attr.title]="themeToggleLabel()" (click)="onThemeToggle()">
                <span class="header__theme-icon header__theme-icon--sun" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path
                            d="M12 2.75v2.5M12 18.75v2.5M21.25 12h-2.5M5.25 12h-2.5M18.54 5.46l-1.77 1.77M7.23 16.77l-1.77 1.77M18.54 18.54l-1.77-1.77M7.23 7.23 5.46 5.46">
                        </path>
                    </svg>
                </span>

                <span class="header__theme-icon header__theme-icon--moon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path d="M20.2 14.35A8.75 8.75 0 1 1 9.65 3.8a7 7 0 1 0 10.55 10.55Z"></path>
                    </svg>
                </span>

                <span class="header__sr-only">{{ themeToggleLabel() }}</span>
            </button>

            <button class="btn btn--primary header__resume" type="button" [disabled]="isResumeDownloading()"
                (click)="onResumeDownload()">
                @if (isResumeDownloading()) {
                <app-loader size="sm" />
                }
                {{ resumeButtonLabel() }}
            </button>

            <button class="header__menu-button" type="button" aria-label="Toggle navigation menu"
                aria-controls="primary-navigation" [attr.aria-expanded]="isMenuOpen()" (click)="onMenuToggle()">
                <span class="header__menu-line" aria-hidden="true"></span>
                <span class="header__menu-line" aria-hidden="true"></span>
                <span class="header__menu-line" aria-hidden="true"></span>
            </button>
        </div>
    </div>
</header>
