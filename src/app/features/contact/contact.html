<section id="contact" class="contact section" aria-labelledby="contact-title">
    <div class="app-container">
        <div class="contact__panel" appRevealOnScroll>
            <div class="contact__content">
                <p class="section__eyebrow">{{ contactContent().eyebrow }}</p>

                <h2 id="contact-title" class="contact__title">
                    {{ contactContent().title }}
                </h2>

                <p class="contact__description">
                    {{ contactContent().description }}
                </p>

                <a class="contact__email" [href]="emailHref()"
                    [attr.aria-label]="'Send an email to ' + contactContent().email">
                    {{ contactContent().email }}
                    <span aria-hidden="true">&rarr;</span>
                </a>

                <p class="contact__location">{{ contactContent().location }}</p>
            </div>

            <ul class="contact__links" aria-label="Other ways to connect">
                @for (link of contactLinks(); track link.label) {
                <li>
                    <a class="contact__link" [href]="link.href" [attr.aria-label]="link.ariaLabel"
                        [attr.target]="link.isExternal ? '_blank' : null"
                        [attr.rel]="link.isExternal ? 'noopener noreferrer' : null">
                        <span class="contact__link-label">{{ link.label }}</span>
                        <span class="contact__link-value">{{ link.value }}</span>
                        <span class="contact__link-arrow" aria-hidden="true">&#8599;</span>
                    </a>
                </li>
                }
            </ul>
        </div>
    </div>
</section>
