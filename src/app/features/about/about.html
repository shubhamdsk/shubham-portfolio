<section id="about" class="section" aria-labelledby="about-title">
    <div class="page grid items-start gap-12 lg:grid-cols-2 lg:gap-16">
        <div class="lg:sticky lg:top-8" appRevealOnScroll>
            <p class="eyebrow">{{ aboutContent().eyebrow }}</p>

            <h2 id="about-title" class="section-title">
                {{ aboutContent().title }}
            </h2>

            <p class="section-desc">
                {{ aboutContent().description }}
            </p>

            <p class="mt-4 max-w-xl text-muted">
                {{ aboutContent().additionalDescription }}
            </p>
        </div>

        <ul class="grid gap-3" aria-label="Strengths">
            @for (highlight of aboutHighlights(); track highlight.title; let index = $index) {
            <li class="card-hover flex gap-4 rounded-2xl border border-line p-5"
                appRevealOnScroll [delay]="index * 80">
                <app-icon-badge [icon]="highlight.icon" [tone]="highlight.tone" />

                <div>
                    <h3 class="font-semibold tracking-tight text-ink">{{ highlight.title }}</h3>
                    <p class="mt-1 text-sm text-muted">{{ highlight.description }}</p>
                </div>
            </li>
            }
        </ul>
    </div>
</section>
