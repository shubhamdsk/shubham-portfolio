<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Shubham Deshmukh - social preview</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&family=JetBrains+Mono:wght@500&display=block">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: Inter, 'Segoe UI', sans-serif;
      color: #f5f7fb;
      background:
        radial-gradient(520px 360px at 8% 0%, rgba(34, 211, 238, 0.16), transparent 70%),
        radial-gradient(560px 420px at 92% 10%, rgba(139, 92, 246, 0.2), transparent 70%),
        #0b0d12;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(180deg, #000 40%, transparent 95%);
    }

    .content {
      position: absolute;
      left: 72px;
      top: 64px;
      width: 600px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand svg {
      width: 64px;
      height: 64px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: #12151d;
      font-size: 17px;
      color: #c9d1e3;
    }

    .status::before {
      content: '';
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
    }

    h1 {
      margin: 40px 0 0;
      font-family: Montserrat, sans-serif;
      font-size: 76px;
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .role {
      margin: 18px 0 0;
      font-family: Montserrat, sans-serif;
      font-size: 34px;
      font-weight: 700;
      background: linear-gradient(90deg, #22d3ee, #3b82f6 45%, #8b5cf6 80%, #fb923c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stack {
      margin: 22px 0 0;
      font-size: 22px;
      line-height: 1.45;
      color: #8f99ae;
    }

    .url {
      position: absolute;
      z-index: 1;
      left: 72px;
      bottom: 54px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      letter-spacing: 0.04em;
      color: #c9d1e3;
    }

    .scene {
      position: absolute;
      right: 40px;
      top: 70px;
      width: 470px;
      height: 440px;
      perspective: 1000px;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      transform: rotateX(18deg) rotateY(-24deg) rotateZ(4deg);
      transform-style: preserve-3d;
    }

    .tile {
      display: grid;
      place-items: center;
      gap: 6px;
      height: 118px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 22px;
      background: linear-gradient(160deg, #191d27, #101219);
      box-shadow: 0 24px 40px -18px rgba(0, 0, 0, 0.8);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #8f99ae;
    }

    .tile img {
      width: 48px;
      height: 48px;
    }

    .tile.core {
      border: 1px solid transparent;
      background:
        radial-gradient(circle at 35% 30%, #1c202b, #07080b 75%) padding-box,
        linear-gradient(135deg, #22d3ee, #3b82f6 40%, #8b5cf6 70%, #fb923c) border-box;
      box-shadow: 0 0 60px -6px rgba(59, 130, 246, 0.55);
      font-size: 34px;
      font-weight: 500;
    }

    .tile.core span {
      background: linear-gradient(90deg, #22d3ee, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .waves {
      position: absolute;
      inset: auto 0 0 0;
      height: 120px;
    }
  </style>
</head>

<body>
  <div class="grid"></div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee" />
            <stop offset="0.4" stop-color="#3b82f6" />
            <stop offset="0.7" stop-color="#8b5cf6" />
            <stop offset="1" stop-color="#fb923c" />
          </linearGradient>
          <linearGradient id="t" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0" stop-color="#1c202b" />
            <stop offset="1" stop-color="#07080b" />
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#t)" stroke="url(#b)" stroke-width="2.5" />
        <text x="32" y="42.5" text-anchor="middle" font-family="Montserrat" font-size="27" font-weight="800"
          fill="url(#b)">SD</text>
      </svg>
      <span class="status">Software Engineer at Hare and Turtle AI Solutions</span>
    </div>

    <h1>Shubham<br>Deshmukh</h1>
    <p class="role">Polyglot full-stack engineer</p>
    <p class="stack">Angular · React · Next.js · .NET · PostgreSQL<br>Web products from interface to database.</p>
  </div>

  <div class="url">shubhamdsk.github.io/shubham-portfolio</div>

  <div class="scene">
    <div class="tiles">
      <div class="tile"><img src="../public/assets/tech/angular.svg" alt=""><span>Angular</span></div>
      <div class="tile"><img src="../public/assets/tech/react.svg" alt=""><span>React</span></div>
      <div class="tile"><img src="../public/assets/tech/nextjs.svg" alt=""><span>Next.js</span></div>
      <div class="tile"><img src="../public/assets/tech/typescript.svg" alt=""><span>TypeScript</span></div>
      <div class="tile core"><span>&lt;/&gt;</span></div>
      <div class="tile"><img src="../public/assets/tech/dotnet.svg" alt=""><span>.NET</span></div>
      <div class="tile"><img src="../public/assets/tech/postgresql.svg" alt=""><span>PostgreSQL</span></div>
      <div class="tile"><img src="../public/assets/tech/redis.svg" alt=""><span>Redis</span></div>
      <div class="tile"><img src="../public/assets/tech/docker.svg" alt=""><span>Docker</span></div>
    </div>
  </div>

  <svg class="waves" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#22d3ee" />
        <stop offset="0.35" stop-color="#3b82f6" />
        <stop offset="0.65" stop-color="#8b5cf6" />
        <stop offset="1" stop-color="#fb923c" />
      </linearGradient>
    </defs>
    <path fill="url(#w)" opacity="0.18" d="M0 70 C200 40 400 100 600 70 S1000 40 1200 70 V120 H0 Z" />
    <path fill="url(#w)" opacity="0.35" d="M0 92 C240 70 360 112 600 94 S960 72 1200 92 V120 H0 Z" />
    <path stroke="url(#w)" fill="none" stroke-width="1.5" opacity="0.7"
      d="M0 58 C220 30 380 88 600 60 S980 30 1200 58" />
  </svg>
</body>

</html>
